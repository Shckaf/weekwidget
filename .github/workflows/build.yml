{"name":"Build APK","on":{"push":{"branches":["main","master"]},"workflow_dispatch":null},"permissions":{"contents":"write"},"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Find project","run":"for z in *.zip; do [ -f \"$z\" ] && unzip -q -o \"$z\" -d unpacked; done || true\nFILE=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)\nif [ -z \"$FILE\" ]; then echo \"settings.gradle.kts not found\"; exit 1; fi\necho \"PROJECT_DIR=$(dirname \"$FILE\")\" >> \"$GITHUB_ENV\"\n"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.9"}},{"name":"Build debug APK","working-directory":"${{ env.PROJECT_DIR }}","run":"gradle assembleDebug --no-daemon --stacktrace"},{"name":"Copy APK","run":"cp \"$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk\" WeekWidget.apk"},{"uses":"actions/upload-artifact@v4","with":{"name":"WeekWidget-apk","path":"WeekWidget.apk"}},{"uses":"softprops/action-gh-release@v2","with":{"tag_name":"build-${{ github.run_number }}","name":"Сборка ${{ github.run_number }}","files":"WeekWidget.apk"}}]}}}
